<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Contracting</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-container {
            text-align: center;
        }

        .logo {
            max-width: 90%;
            width: 200px;
            padding: 20px;
        }

        .logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        footer {
            padding: 20px;
            text-align: center;
            border-top: 1px solid #e0e0e0;
        }

        footer a {
            color: #000000;
            text-decoration: none;
            margin: 0 15px;
            font-size: 14px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .logo {
                width: 150px;
                padding: 15px;
            }

            footer {
                padding: 15px 10px;
            }

            footer a {
                display: inline-block;
                margin: 5px 10px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                width: 120px;
                padding: 10px;
            }

            footer a {
                display: block;
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="logo-container">
            <div class="logo">
                <img src="logo.png" alt="NK Contracting">
            </div>
        </div>
    </main>

    <footer>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms-of-use.html">Terms of Use</a>
    </footer>
</body>
</html>
